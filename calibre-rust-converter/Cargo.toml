[package]
name = "calibre-converter"
version = "0.1.0"
edition = "2021"
authors = ["Calibre Rust Converter"]
description = "A Rust implementation of Calibre's ebook-convert functionality"
license = "GPL-3.0"

[dependencies]
# CLI and async
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# XML and HTML processing
quick-xml = { version = "0.31", features = ["serialize"] }
html-escape = "0.2"
regex = "1.0"

# Compression and encoding
flate2 = "1.0"
encoding_rs = "0.8"

# Logging and error handling
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

# File handling
walkdir = "2.3"
zip = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "calibre-converter"
path = "src/main.rs"

[features]
default = []
# Enable additional features as needed
epub-support = []
mobi-support = []
pdf-support = []
azw3-support = [] 